                      <h4 className="text-base font-bold text-white">Demo Message Received!</h4>
                      <p className="text-xs text-slate-300">
                        Thank you, {formData.name}. You can also email directly to <span className="text-electric-blue">{data.email}</span>.
                      </p>
                      <button onClick={() => setFormSubmitted(false)} className="px-4 py-2 rounded-lg bg-white/10 text-xs font-semibold text-white">
                        Send another note
                      </button>
                    </div>
                  ) : (
                    <form onSubmit={handleFormSubmit} className="space-y-4">
                      <div>
                        <label className="text-xs font-mono text-slate-300 block mb-1">Name</label>
                        <input
                          type="text"
                          required
                          value={formData.name}
                          onChange={(e) => setFormData({...formData, name: e.target.value})}
                          placeholder="Your Name"
                          className="w-full px-4 py-2.5 rounded-xl bg-navy-900 border border-white/10 text-white placeholder-slate-500 text-sm focus:border-electric-blue"
                        />
                      </div>
                      <div>
                        <label className="text-xs font-mono text-slate-300 block mb-1">Email</label>
                        <input
                          type="email"
                          required
                          value={formData.email}
                          onChange={(e) => setFormData({...formData, email: e.target.value})}
                          placeholder="your.email@example.com"
                          className="w-full px-4 py-2.5 rounded-xl bg-navy-900 border border-white/10 text-white placeholder-slate-500 text-sm focus:border-electric-blue"
                        />
                      </div>
                      <div>
                        <label className="text-xs font-mono text-slate-300 block mb-1">Message</label>
                        <textarea
                          required
                          rows="4"
                          value={formData.message}
                          onChange={(e) => setFormData({...formData, message: e.target.value})}
                          placeholder="Your message, project idea, or inquiry..."
                          className="w-full px-4 py-2.5 rounded-xl bg-navy-900 border border-white/10 text-white placeholder-slate-500 text-sm focus:border-electric-blue resize-none"
                        ></textarea>
                      </div>
                      <button
                        type="submit"
                        className="w-full py-3 rounded-xl bg-gradient-to-r from-electric-blue to-accent-purple text-navy-950 font-bold text-sm shadow-md"
                      >
                        Submit Demo Note
                      </button>
                    </form>
                  )}
                </div>
              </div>
            </div>
          </section>

          {/* Footer */}
          <footer className="bg-navy-950 border-t border-white/10 py-10 text-slate-400">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs font-mono">
              <div>
                © {new Date().getFullYear()} Kavya Jain. All rights reserved.
              </div>
              <div className="text-slate-300">
                Designed and built by <span className="text-electric-blue font-semibold">Kavya Jain.</span>
              </div>
              <button 
                onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
                className="p-2 rounded-lg bg-white/5 hover:bg-white/10 text-slate-300"
                aria-label="Back to top"
              >
                <Icons.ArrowUp />
              </button>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
